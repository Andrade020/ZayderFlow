[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zayderflow"
version = "0.1.0"
description = "Editor visual low-code de arquiteturas multi-agente de IA: desenhe caixinhas e setas, rode o fluxo e veja as mensagens fluírem"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Lucas Rafael de Andrade", email = "lucas.ibge1999@gmail.com" }]
keywords = ["ai", "agent", "multi-agent", "llm", "orchestrator", "low-code", "node-editor"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "litellm>=1.40",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "aider-chat>=0.80",
    # Python 3.13 removeu o módulo `audioop` da stdlib (PEP 594); o aider importa
    # a pydub, que precisa dele. O audioop-lts reinstala o módulo.
    "audioop-lts; python_version >= '3.13'",
]

[project.urls]
Repository = "https://github.com/Andrade020/ZayderFlow"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "httpx>=0.27"]

[project.scripts]
zflow = "zflow.cli:main"

[tool.setuptools.packages.find]
include = ["zflow*"]

[tool.setuptools.package-data]
zflow = ["webapp/*", "templates/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
